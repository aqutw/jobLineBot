name: Go CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -tags netgo -trimpath -o bin/bot ./cmd/bot
